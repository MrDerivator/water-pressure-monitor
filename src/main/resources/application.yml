server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/watermonitor}
    username: ${JDBC_DATABASE_USERNAME:watermonitor}
    password: ${JDBC_DATABASE_PASSWORD:watermonitor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  dashboard-password: ${APP_DASHBOARD_PASSWORD:changeme}
  device-api-key: ${APP_DEVICE_API_KEY:dev-key-change-me}
  device-name: ${APP_DEVICE_NAME:Main water line}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
