services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watermonitor
      POSTGRES_USER: watermonitor
      POSTGRES_PASSWORD: watermonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watermonitor -d watermonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/watermonitor
      JDBC_DATABASE_USERNAME: watermonitor
      JDBC_DATABASE_PASSWORD: watermonitor
      APP_DASHBOARD_PASSWORD: admin
      APP_VIEWER_PASSWORD: viewer
      APP_DEVICE_API_KEY: local-dev-key
      APP_DEVICE_NAME: "Local test device"
      # Telegram off by default for local testing -- flip to true and add
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID here if you want to test alerts locally.
      TELEGRAM_ENABLED: "false"

volumes:
  pgdata:
